name: Keep Supabase awake

# Free Supabase projects pause after ~1 week without activity.
# This makes one tiny database call every 3 days so that never happens.
on:
  schedule:
    - cron: '17 9 */3 * *' # every 3 days at 09:17 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          response=$(curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Response: $response"
          [ "$response" = "true" ]
